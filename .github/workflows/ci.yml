name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Check package
        run: pnpm check

      - name: Test Node integration
        run: pnpm test:e2e:node

      - name: Install Chromium
        run: pnpm --filter @hsblabs/fetch-interceptor-e2e exec playwright install --with-deps chromium

      - name: Test browser integration
        run: pnpm test:e2e:browser
